name: Reelables
description: >-
  Reelables provides Track Anywhere smart labels and a RESTful platform API for global
  supply-chain and logistics visibility. The paper-thin Bluetooth and cellular smart labels
  are printed on off-the-shelf barcode printers, activated, attached to assets, and tracked in
  real time across a network of devices and gateways. The Reelables API lets developers manage
  Workspaces, Assets, Labels, Spaces, Gateways, Consignments, Facilities, Printers and Print
  Jobs, and read location, temperature and facility history for tracked assets. A separate
  Gateway API lets partner devices push label-data and snapshots into the platform. Reelables
  is a 500 Global portfolio company (surfaced in this network under the stub slug "got-its").
