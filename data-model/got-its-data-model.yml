entities:
- name: Workspace
  description: Permissions boundary (organization/team) that owns all other resources.
- name: Asset
  description: A physical item being tracked; Labels are attached to Assets.
- name: Label
  description: A Reelables smart label producing signals detected by Gateways.
- name: Space
  description: A physical area (static or mobile) where Assets can be detected; characterized by a Gateway.
- name: Gateway
  description: A device that listens for signals from Labels.
- name: Consignment
  description: A collection of pieces (Assets) being tracked together, e.g. a shipment.
- name: Piece
  description: An Asset in the context of a Consignment.
- name: Facility
  description: A physical location comprised of one or more Spaces.
- name: Printer
  description: A device linked to a Workspace used to print/activate Labels.
- name: PrintJob
  description: A printing operation queued to a Printer.
